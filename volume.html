<h2>訊號密度(每根 15m 棒:全市場 E 觸發 / F 觸發 → 護欄 → 各篩法通過的 E 觸發檔數)</h2><div id="dens"></div>
<h2>事件流</h2><div class="feed" id="feed"></div>
<div class="note" id="conf"></div>
<script>
// 涵蓋率:本帳幣單有幾個拿到價。分母讀不到就講「不知道」,不用全市場數字頂替。
function covTxt(d){
 if(d.pxUniv==null) return '<span class=wn>本帳幣單讀不到・不知道涵蓋幾個幣</span>';
 if(d.pxMiss) return '<span class=dn>本帳 '+d.pxUniv+' 幣有 '+d.pxMiss+' 個沒價：'+d.pxMissList.join('、')+(d.pxMiss>d.pxMissList.length?'…':'')+'</span>';
 return '本帳 '+d.pxUniv+' 幣全到齊';
}
function pxTxt(d){
 if(!d.pxAt) return '<span class=wn>｜現價：還沒成功取過（不知道）</span>';
 const m=Math.round((d.now-d.pxAt)/60000);
 return d.pxErr
  ? '<span class=dn>｜⚠ 這一輪沒取到現價（'+d.pxErr+'）・表上現價是 '+m+' 分鐘前的</span>'
  : '<span class=dim title="全市場可交易 symbol 共 '+d.pxN+' 個(含 USDC/USD1/U/BTC 計價與股票永續);本帳只跑 USDT 永續扣穩定幣">｜現價 '+m+' 分鐘前（'+covTxt(d)+'）</span>';
}

const f2=(x,d=2)=>x==null||Number.isNaN(x)?'—':(+x).toFixed(d);
const pct=x=>x==null?'—':(x>=0?'+':'')+x.toFixed(2)+'%';
const cls=x=>x>0?'up':x<0?'dn':'dim';
// 使用者挑出來重點觀察的格子(0915):👴💰 穩健型、🚀 爆發型;只是顯示標記,不影響引擎
const BADGE={GV3:['👴💰','穩健型'],EV3:['👴💰','穩健型'],FV6:['🚀','爆發型']};
const badge=id=>BADGE[id]?'<span title="'+BADGE[id][1]+'">'+BADGE[id][0]+'</span> ':'';
const tw=ts=>new Date(ts+8*3600e3).toISOString().slice(5,16).replace('T',' ');
// 結案拆賺賠;對帳不過就不給數字,只亮警告(滑鼠移上去看原因)
const wlTxt=(w,n)=>{
 if(!w||!n)return '';
 if(!w.ok)return ' <span class=wn title="逐筆紀錄與帳本對不上:查不到 '+w.miss+' 筆、手續費不知道 '+(w.feeUnk||0)+' 筆、差 '+f2(w.diff,2)+'U(容差 '+f2(w.tol,2)+'),賺賠數不可信">⚠賺賠對不上</span>';
 const tip=(k,c,u)=>c+' 筆淨'+k+',共 '+(u>=0?'+':'')+f2(u,0)+'U(已扣進出場手續費與資金費)';
 return '<span class=dim>(</span><span class=up title="'+tip('賺',w.win,w.winU)+'">賺'+w.win+'</span> <span class=dn title="'+tip('賠',w.loss,w.lossU)+'">賠'+w.loss+'</span><span class=dim>)</span>';
};
async function refresh(){
 const d=await (await fetch('/data')).json();
 if(d.err){document.getElementById('top').innerHTML=d.err;return}
 const hbAge=d.hb?(d.now-d.hb.ts)/60e3:null;
 const hbTxt=hbAge==null?'<span class=dn>無心跳</span>':hbAge<20?'<span class=up>●引擎活著 '+f2(hbAge,0)+'分前'+(d.hb.sec?'(上輪 '+f2(d.hb.sec,0)+'s)':'')+'</span>':'<span class=dn>●心跳停了 '+f2(hbAge,0)+'分</span>';
 document.getElementById('top').innerHTML='<h2>🌊 波動篩選紙上帳('+d.books.length+'本×'+d.cap+'U 5x,全市場不吃雷達)</h2>'+(d.frozen&&d.frozen.length?'<span class=dim>另有 '+d.frozen.length+' 本凍結(這個實例只跑 '+d.books.map(b=>b.id).join(',')+';研究看 8899)</span> ':'')+hbTxt+
  '<span class=dim>開帳 '+tw(d.startTs)+'|已處理到 '+tw(d.lastBarCt)+'</span>'+pxTxt(d);
 let rows='';
 for(const e of (d.entryOrder||['E','F','C','D','G','H'])){
  const bs=d.books.filter(b=>b.entry===e&&!b.variantOf); if(!bs.length)continue;
  const R=bs.find(b=>b.screen==='R');
  const sumEq=bs.reduce((s,b)=>s+b.eq,0), sumPos=bs.reduce((s,b)=>s+b.pos.length,0);
  const late=bs[0].startTs>d.startTs+60e3?' <span class=wn title="這列晚開帳,累積天數不同,%不能直接和別列比">'+tw(bs[0].startTs)+' 開帳</span>':'';
  rows+='<div class=rowhead><h3>'+e+' 進場:<span class=wn>'+d.entry[e].name+'</span></h3><span class=dim>'+d.entry[e].how+'</span><span class=dim>|'+d.entry[e].stop+'</span><span class=dim>|7 本合計 '+pct((sumEq/(d.cap*bs.length)-1)*100)+'|持倉 '+sumPos+'</span>'+late+'</div>';
  const isLimit=d.entry[e].mode==='limit';
  rows+='<div class=cards>'+bs.map(b=>{
   const r=(b.eq/d.cap-1)*100;
   const vsR=R&&b.screen!=='R'?'<br><span class=dim title="本帳權益% 減 同列隨機對照權益%">vs隨機 </span><span class="'+cls(r-(R.eq/d.cap-1)*100)+'">'+pct(r-(R.eq/d.cap-1)*100)+'</span>':'<br><span class=dim>(對照組)</span>';
   const g=isLimit?' <span class=dim>|掛'+b.orders+'張'+(b.holdN?' 凍'+b.holdN+'張/'+f2(b.held,0)+'U':'')+'</span>':'';
   return '<div class=card title="'+b.desc+'">'+badge(b.id)+'<span class=dim>'+b.id+'</span> <span class=wn>'+b.name+'</span><br><b class="'+cls(r)+'">'+f2(b.eq,0)+'</b> <span class="'+cls(r)+'">'+pct(r)+'</span>'+vsR+'<br>'+
   '<span class=dim>浮動 </span><span class="'+cls(b.upnl)+'">'+f2(b.upnl,1)+'</span><span class=dim> |持倉 '+b.pos.length+' |結案 '+b.closed+'</span>'+wlTxt(b.wl,b.closed)+g+'<br>'+
   '<span class=dim>初損'+b.done['初損']+' 追'+b.done['追蹤']+(b.done['破帶']?' 破帶'+b.done['破帶']:'')+' 24h'+b.done['滿24']+' 強平'+b.done['強平']+' |放票'+(b.stats.full||0)+(d.entry[e].gate?' 閘門擋'+(b.stats.gate||0):'')+(d.entry[e].requeue?' 候補'+(b.stats.requeue||0):'')+'</span></div>'}).join('')+'</div>';
 }
 const VB=d.books.filter(b=>b.variantOf);
 if(VB.length){
  const rl=VB[0].rule||{};
  rows+='<div class=rowhead><h3>分身實驗:<span class=wn>帳戶追蹤停利</span></h3><span class=dim>跟本尊同訊號、同成交、同停損與出場;唯一差別:帳戶權益(含浮動,引擎用 15m 收盤算)≥ 基準×'+f2(1+rl.A,2)+' 啟動,從最高點吐回利潤 '+f2(rl.G,2)+' 就下一根開盤全平,基準改成平倉後權益、照常交易。卡片的權益用即時價,跟引擎判斷的收盤權益會差一點</span></div>';
  rows+='<div class=cards>'+VB.map(b=>{
   const r=(b.eq/d.cap-1)*100, src=d.books.find(x=>x.id===b.variantOf), rs=src?(src.eq/d.cap-1)*100:null, a=b.acct;
   const vs=src?'<br><span class=dim title="本帳權益% 減 本尊權益%">vs本尊 '+src.id+' </span><span class="'+cls(r-rs)+'">'+pct(r-rs)+'</span>':'';
   const at=a?'<br><span class=dim>基準 '+f2(a.base,0)+(a.active?' |已啟動 最高 '+f2(a.peakEq,0)+' 觸發線 </span><span class=wn>'+f2(b.line,0)+'</span><span class=dim>':' |未啟動(啟動線 '+f2(a.base*(1+(b.rule?b.rule.A:0)),0)+')')+(a.pending?' |等平倉':'')+' |已全平 '+a.locks+' 次</span>':'';
   return '<div class=card title="'+b.desc+'">'+badge(b.id)+'<span class=dim>'+b.id+'</span> <span class=wn>'+b.name+'</span><br><b class="'+cls(r)+'">'+f2(b.eq,0)+'</b> <span class="'+cls(r)+'">'+pct(r)+'</span>'+vs+'<br>'+
   '<span class=dim>浮動 </span><span class="'+cls(b.upnl)+'">'+f2(b.upnl,1)+'</span><span class=dim> |持倉 '+b.pos.length+' |結案 '+b.closed+'</span>'+wlTxt(b.wl,b.closed)+'<br>'+
   '<span class=dim>初損'+b.done['初損']+' 追'+b.done['追蹤']+' 24h'+b.done['滿24']+' 強平'+b.done['強平']+' 帳戶停利'+b.done['帳戶停利']+' |放票'+(b.stats.full||0)+'</span>'+at+'</div>'}).join('')+'</div>';
 }
 document.getElementById('rows').innerHTML=rows;
 document.getElementById('legend').innerHTML='<b>怎麼讀</b>:一列一種進場(E/F/G),一欄一種挑法(V1~V6 + R 隨機對照)。每張卡「vs隨機」= 這本減同一列的 R,那才是挑法的分數;同一欄上下比 = 進場方式的分數。'+
  '<br><b>結案(賺 X 賠 Y)</b>:按每筆淨損益分(已扣進出場手續費與資金費,大於 0 才算賺),滑鼠移上去看金額。出場原因的「追」不等於賺:價格先漲一點、追蹤線超過初損線後就改標追蹤,之後跌下來出場照樣賠錢。'+
  '<br><b>挑法</b>:'+d.screens.map(s=>s.id+' '+s.name+'('+s.desc+')').join(';')+
  '<br><b>'+d.exitTxt+'</b> （護欄與部位設定未公開）';
 const posRows=[];
 for(const b of d.books)for(const p of b.pos)posRows.push('<tr><td>'+badge(b.id)+b.id+' <span class=dim>'+d.entry[b.entry].name+' × '+b.name+'</span></td><td>'+p.sym+'</td><td>'+f2(p.entry,6)+'</td><td>'+f2(p.cur,6)+'</td><td class="'+cls(p.uPct)+'">'+pct(p.uPct)+'</td><td>'+p.stopKind+'@'+f2(p.stop,6)+' <span class=dim>('+pct(p.stopPct)+')</span></td><td>'+f2(p.holdH,1)+'h</td><td>'+p.fillPct+'%</td><td class=dim>'+(p.f?'晃'+f2(p.f.r7,2)+'x 4h'+f2(p.f.r4h,2)+'x 悶'+f2(p.f.sqz,2)+' ATR'+f2(p.f.atrPct,2)+'% 上'+f2(p.f.upShare,2)+' 量'+f2(p.f.volR,1)+'x 名次'+f2(p.rank,2):'')+'</td></tr>');
 document.getElementById('pos').innerHTML=posRows.length?'<table><tr><th>帳</th><th>幣</th><th>進場</th><th>現價</th><th>浮動</th><th>停損</th><th>持有</th><th>成交%</th><th>訊號時特徵</th></tr>'+posRows.join('')+'</table>':'<span class=dim>(空手)</span>';
 const S=d.screens.map(s=>s.id);
 document.getElementById('dens').innerHTML=d.density.length?'<table><tr><th>棒</th><th>E觸發</th><th>F觸發</th><th>護欄擋</th>'+S.map(b=>'<th>'+b+'</th>').join('')+'<th>耗時</th></tr>'+d.density.map(x=>'<tr><td>'+tw(x.ct)+'</td><td>'+x.trig+'</td><td>'+(x.ftrig==null?'—':x.ftrig)+'</td><td class=dim>'+x.guard+'</td>'+S.map(b=>'<td>'+(x[b]==null?'—':x[b])+'</td>').join('')+'<td class=dim>'+(x.ms?f2(x.ms/1000,0)+'s':'—')+'</td></tr>').join('')+'</table>':'<span class=dim>(還沒跑過)</span>';
 document.getElementById('feed').innerHTML=d.events.map(e=>{
  const t=e.barCt?tw(e.barCt):'';
  if(e.ev==='fill')return '<div>'+t+' 🎯 <b>'+e.book+'</b> '+(e.market?'市價買':'限價成交')+' '+e.sym.replace('USDT','')+' @'+f2(e.px,6)+(e.fillPct&&e.fillPct<100?' ('+e.fillPct+'%)':'')+' <span class=dim>停損@'+f2(e.stop,6)+(e.slipBp!=null?' 滑'+f2(e.slipBp,0)+'bp':'')+'</span></div>';
  if(e.ev==='exit')return '<div>'+t+' '+(e.pnl>=0?'🟢':'🔴')+' <b>'+e.book+'</b> '+e.sym.replace('USDT','')+' '+e.why+' '+(e.pnl>=0?'+':'')+f2(e.pnl,1)+'U → 權益 '+f2(e.eq,0)+' <span class=dim>'+f2(e.holdH,1)+'h</span></div>';
  if(e.ev==='fund_fix')return '<div class=wn>'+t+' 🧾 <b>'+e.book+'</b> '+e.sym.replace('USDT','')+' 資金費補記 '+(e.cost>0?'付 ':'收 ')+f2(Math.abs(e.cost),2)+'U <span class=dim>(那筆平倉漏了這次結算,已扣回權益)</span></div>';
  if(e.ev==='reject')return '<div class=dim>'+t+' 🚫 '+e.book+' '+e.sym.replace('USDT','')+' '+e.why+'</div>';
  if(e.ev==='acct_trigger')return '<div class=wn>'+t+' ⚠ <b>'+e.book+'</b> 帳戶追蹤停利觸發:權益 '+f2(e.eq,0)+' ≤ 觸發線 '+f2(e.line,0)+'(最高 '+f2(e.peakEq,0)+'、基準 '+f2(e.base,0)+'),'+e.n+' 筆下一根開盤平倉</div>';
  if(e.ev==='acct_lock')return '<div class=wn>'+t+' 🔒 <b>'+e.book+'</b> 帳戶追蹤停利全平完成:基準 '+f2(e.baseBefore,0)+' → '+f2(e.baseAfter,0)+'</div>';
  return '';
 }).join('');
 const c=d.conf;
 document.getElementById('conf').innerHTML=c?'門檻(凍結 '+c.frozenAt.slice(0,16).replace('T',' ')+'Z,校準窗 '+c.window.from+'~'+c.window.to+',目標每天 '+c.TARGET+' 檔):V1 晃>'+c.K1+'x|V2 4h放大>'+c.K2+'x 且未達V1|V3 悶≤'+c.K3+' 且放大≥'+c.K3X+'x|V4 名次前 '+(c.Q4*100).toFixed(1)+'%|V5 漲棒占比>'+c.K5+'|V6 量>'+c.K6+'x|R 機率 '+c.P+'|護欄 ATR '+(c.ATR_LO*100).toFixed(2)+'%~'+(c.ATR_HI*100).toFixed(1)+'%':'(無門檻檔)';
}
refresh();setInterval(refresh,60000);
</script></body></html>
<div id="__snapbar" style="position:fixed;top:0;left:0;right:0;z-index:2147483647;font:13px/1.7 system-ui,'Microsoft JhengHei',sans-serif;text-align:center;padding:5px 10px"></div>
<div style="height:32px"></div>
<script>
(function(){
  function paint(){
    var bar=document.getElementById('__snapbar'); if(!bar) return;
    var mins=Math.floor((Date.now()-window.__SNAP_AT__)/60000);
    var when=new Date(window.__SNAP_AT__).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
    var age = mins<1 ? '不到 1 分鐘前' : (mins<60 ? mins+' 分鐘前' : Math.floor(mins/60)+' 小時 '+(mins%60)+' 分鐘前');
    var bg,fg,msg;
    if(mins<15){ bg='#123d1c'; fg='#8ee3a3'; msg='靜態快照 · 資料為 '+age+'（台北時間 '+when+'）'; }
    else if(mins<60){ bg='#7a4b00'; fg='#ffd79a'; msg='⚠ 靜態快照 · 已 '+age+'沒更新（台北時間 '+when+'）'; }
    else { bg='#5a1111'; fg='#ffb4b4'; msg='⚠ 來源可能已離線 · 資料停在 '+age+'（台北時間 '+when+'）· 不是即時數字'; }
    bar.style.background=bg; bar.style.color=fg; bar.textContent=msg;
  }
  paint(); setInterval(paint,30000);
})();
</script>
