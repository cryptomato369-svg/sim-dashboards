<script>
function pxTxt(d){
 if(!d.pxAt) return '<span class=wn>｜現價：還沒成功取過（不知道）</span>';
 const m=Math.round((d.now-d.pxAt)/60000);
 return d.pxErr
  ? '<span class=dn>｜⚠ 這一輪沒取到現價（'+d.pxErr+'）・表上現價是 '+m+' 分鐘前的</span>'
  : '<span class=dim>｜現價 '+m+' 分鐘前（'+d.pxN+' 個幣）</span>';
}

const f2=(x,d=2)=>x==null?'—':(+x).toFixed(d);
const pct=x=>x==null?'—':(x>=0?'+':'')+x.toFixed(2)+'%';
const cls=x=>x>0?'up':x<0?'dn':'dim';
const tw=ts=>new Date(ts+8*3600e3).toISOString().slice(5,16).replace('T',' ');
async function refresh(){
 const d=await (await fetch('/data')).json();
 if(d.err){document.getElementById('top').innerHTML=d.err;return}
 const hbAge=d.hb?(d.now-d.hb.ts)/60e3:null;
 const hbTxt=hbAge==null?'<span class=dn>無心跳</span>':hbAge<20?'<span class=up>●引擎活著 '+f2(hbAge,0)+'分前</span>':'<span class=dn>●心跳停了 '+f2(hbAge,0)+'分</span>';
 // 交易總開關:開著=照規則交易;關著=只觀察(訊號/掛單價/穿價照記,不下單)。切換一律轉交引擎
 const off=!!(d.sw&&!d.sw.on);
 const swBtn=off
  ?'<button class="sw off" onclick="toggleSw(true)" title="按下去 = 打開交易:下一根完整 15 分鐘 K 起恢復掛單/進場">⏸ 只觀察中('+tw(d.sw.since)+' 起)|按此打開交易</button>'
  :'<button class="sw on" onclick="toggleSw(false)" title="按下去 = 關閉交易:21 本全部持倉市價結清、撤掉所有掛單;觀察照常">🟢 交易中|按此關閉交易</button>';
 document.getElementById('top').innerHTML='<h2>🧪 紙上帳('+d.books.length+'本×'+d.cap+'U)</h2>'+swBtn+hbTxt+
  '<span class=dim>開帳 '+tw(d.startTs)+'|已處理到 '+tw(d.lastBarCt)+'|掛單 '+d.orders.length+' 檔</span>'+pxTxt(d);
 document.getElementById('cards').innerHTML=d.books.map(b=>{
  const r=(b.eq/d.cap-1)*100;
  const late=b.startTs>d.startTs+60e3?' <span class=wn title="這本帳的開帳日,晚於 A/B,累積天數不同不能直接比%">'+tw(b.startTs).slice(0,5)+' 開帳</span>':'';
  // E/F/G 換的是進場不是出場,卡片要標進場方式,否則三張卡都寫「追蹤」看不出差別
  const ent=b.entry?' <span class=wn>'+b.entry+'</span>':'';
  return '<div class=card><span class=dim>'+b.id+' '+b.lev+'x '+b.exit+'</span>'+ent+late+'<br><b class="'+cls(r)+'">'+f2(b.eq,0)+' U</b> <span class="'+cls(r)+'">'+pct(r)+'</span><br>'+
  // 凍結要顯示出來,否則會出現「現金很少、持倉也沒幾個,錢卻不知去向」的無解畫面
  '<span class=dim>浮動 </span><span class="'+cls(b.upnl)+'">'+f2(b.upnl,1)+'</span> <span class=dim>|持倉 '+b.pos.length+(b.holdN?' |掛單凍結 '+b.holdN+'張/'+f2(b.held,0)+'U':'')+'</span><br>'+
  '<span class=dim>破'+b.done['破']+' 初損'+b.done['初損']+' 保'+b.done['保']+' 移'+b.done['移']+' 追'+b.done['追']+' 24h'+b.done['滿24']+' 強平'+b.done['強平']+' 手'+b.done['手動']+' 放'+b.done['放票']+(b.done['關']?' 關'+b.done['關']:'')+(b.done['停']?' 停'+b.done['停']:'')+'</span></div>'}).join('');
 // 每個可手動結單的組各一顆按鍵。A/B 是對照組,不給任何按鍵。
 // 刻意不做「多組一起平」:各組是對照實驗,一起平會讓各自的唯一變因失去意義。
 // 沒單時按鍵照樣顯示(變灰不可按),不要整個藏起來——藏起來使用者會以為功能不見了。
 const killBtn=(g,h)=>!h?'':h.n
  ? '<button class=xa onclick="kill(\''+g+'\',\'ALL\','+h.n+')">🔴 '+g+'組結清('+h.n+' 筆,'+h.syms.join('/')+')</button>'
    +'<span class=dim>浮動 </span><span class="'+cls(h.u)+'">'+f2(h.u,1)+'U</span> '
  : '<button class=xa disabled>🔴 '+g+'組結清</button><span class=dim>'+g+' 空手 </span>';
 document.getElementById('killall').innerHTML=['C','D','E','F','G','H'].map(g=>killBtn(g,d.held[g])).join('<div style="height:4px"></div>');
 const posRows=[];
 // 護盤欄:C 與 D 的 exit 字串不同('追蹤'/'追蹤+候補'),但停損型態一樣,一律用前綴判斷
 for(const b of d.books)for(const p of b.pos)posRows.push('<tr><td>'+b.id+'</td><td>'+p.sym+' '+p.tier+'</td><td>'+f2(p.entry,6)+'</td><td>'+f2(p.cur,6)+'</td><td class="'+cls(p.uPct)+'">'+pct(p.uPct)+'</td><td>'+(p.stop?(p.stop>p.entry?(b.exit.startsWith('追蹤')?'追蹤@':'移損@')+f2(p.stop,6):(b.exit.startsWith('追蹤')?'追蹤@'+f2(p.stop,6):'✅保本')):'—')+'</td><td>'+f2(p.holdH,1)+'h</td><td>'+p.fillPct+'%</td></tr>');
 document.getElementById('pos').innerHTML=posRows.length?'<table><tr><th>帳</th><th>幣</th><th>進場</th><th>現價</th><th>浮動</th><th>護盤</th><th>持有</th><th>成交%</th></tr>'+posRows.join('')+'</table>':'<span class=dim>(空手)</span>';
 // 四態:●持倉=已進場(滑上去看成交%與還會不會補倉);✓掛=價格跌破就吃;
 // ⏳候補=還吃得到但要「開盤仍在掛單價上方」的真回踩(手動平倉過、或 D 組滿倉錯過);
 // —=該組對這張已出局。原因一律放 title,滑鼠移上去看,不佔版面。
 const cnt=(g,s)=>d.orders.filter(o=>o[g]&&o[g].s===s).length;
 const slot=v=>!v?'<span class=dim title="該組尚未開帳">—</span>'
  :v.s==='持倉'?'<span class=up title="'+v.why+'">●持倉</span>'
  :v.s==='跟'?(off?'<span class=dim title="只觀察中:不下單,只記價格有沒有穿">👁看</span>':'<span class=up title="'+(v.why||'等價格跌破掛單價')+'">✓掛</span>')
  :v.s==='候補'?'<span class=wn title="'+v.why+'">⏳候補</span>'
  :'<span class=dim title="'+v.why+'">—</span>';
 // 只列走限價的組(C/D/G)。E/F 市價進場不掛單,沒有「跟不跟掛」可言
 const grpTxt=g=>g.toUpperCase()+' 持倉'+cnt(g,'持倉')+(off?'/看':'/跟掛')+cnt(g,'跟')+'/候補'+cnt(g,'候補');
 document.getElementById('ord').innerHTML=d.orders.length?(off?'<span class=wn>⏸ 只觀察中:下面的單都不下,只記價格有沒有穿|</span>':'')+'<span class=dim>共 '+d.orders.length+' 張|'+grpTxt('c')+'|'+grpTxt('d')+'|'+grpTxt('g')+'|'+grpTxt('h')+'(E/F 是市價進場不掛單,未列;其餘已出局,滑到「—」看原因)</span><table><tr><th>幣</th><th>級</th><th>掛單價</th><th>現價</th><th>距離</th><th>剩餘</th><th>C組</th><th>D組</th><th>G組</th><th>H組</th></tr>'+d.orders.map(o=>'<tr><td>'+o.sym+'</td><td>'+o.tier+'</td><td>'+(o.price?f2(o.price,6):'<span class=wn>帶未就位</span>')+'</td><td>'+f2(o.cur,6)+'</td><td>'+(o.dist!=null?pct(o.dist):'—')+'</td><td>'+f2(o.expH,0)+'h</td><td>'+slot(o.c)+'</td><td>'+slot(o.d)+'</td><td>'+slot(o.g)+'</td><td>'+slot(o.h)+'</td></tr>').join('')+'</table>':'<span class=dim>(無掛單)</span>';
 document.getElementById('feed').innerHTML=d.events.map(e=>{
  const t=e.barCt?tw(e.barCt):'';
  if(e.ev==='fill')return '<div>'+t+' 🎯 <b>'+e.book+'</b> 買進 '+e.sym.replace('USDT','')+' @'+f2(e.px,6)+'('+e.fillPct+'%)</div>';
  if(e.ev==='exit')return '<div>'+t+' '+(e.pnl>=0?'🟢':'🔴')+' <b>'+e.book+'</b> '+e.sym.replace('USDT','')+' '+e.why+' '+(e.pnl>=0?'+':'')+f2(e.pnl,1)+'U → 權益 '+f2(e.eq,0)+'</div>';
  if(e.ev==='pierce')return '<div class=dim>'+t+' ⚡ '+e.sym.replace('USDT','')+' 穿價 $'+e.pierceUsd+(e.off?'(只觀察,沒下單)':'')+'</div>';
  if(e.ev==='switch')return '<div class=wn>'+tw(e.ts)+(e.on?' ▶ 交易打開(下一根完整 15 分 K 起恢復掛單/進場)':' ⏸ 交易關閉:結清 '+e.closed+' 筆 '+(e.pnl>=0?'+':'')+f2(e.pnl,1)+'U、撤掛單 '+e.unheld+' 張,之後只觀察')+'</div>';
  if(e.ev==='touch_only')return '<div class=dim>'+t+' 👆 '+e.sym.replace('USDT','')+' 只觸未穿(對照)</div>';
  if(e.ev==='order_new')return '<div class=dim>'+t+' 📥 新訊號 '+e.sym.replace('USDT','')+' '+(e.tier||'')+'</div>';
  if(e.ev==='requeue')return '<div class=dim>'+t+' 🔁 <b>'+e.book+'</b> '+e.sym.replace('USDT','')+' 候補補進(滿倉錯過的單,等到真回踩才補)</div>';
  if(e.ev==='reject')return '<div class=dim>'+t+' 🚫 '+(e.book||'')+' '+e.sym.replace('USDT','')+' '+e.why+'</div>';
  return '';
 }).join('');
}
async function kill(book,sym,n){
 if(!confirm('確定把 '+book+' 組全部 '+n+' 筆持倉以現價市價結清?\n\n含 taker 手續費 0.05% + 滑價 0.1%,寫進帳本後不可復原。\n其他組(含另一組追蹤帳)不受影響。'))return;
 const btns=document.querySelectorAll('button.xa');btns.forEach(b=>b.disabled=true);
 const msg=document.getElementById('msg');msg.innerHTML='<span class=wn>結單中…(引擎正在跑時最多等 90 秒)</span>';
 try{
  const r=await fetch('/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book:book,sym:sym})});
  const j=await r.json();
  if(!j.ok)msg.innerHTML='<span class=dn>✗ '+(j.err||'失敗')+'</span>';
  else if(!j.closed.length)msg.innerHTML='<span class=wn>沒有可結清的持倉(可能剛好被引擎平掉了)</span>';
  else{const t=j.closed.reduce((s,c)=>s+c.pnl,0);
   msg.innerHTML='<span class=up>✓ 已結清 '+j.closed.length+' 筆持倉,合計 '+(t>=0?'+':'')+t.toFixed(1)+'U</span>'
    +(j.missing&&j.missing.length?' <span class=dn>(抓不到現價未平:'+j.missing.join(',')+')</span>':'');}
 }catch(e){msg.innerHTML='<span class=dn>✗ '+e.message+'</span>';}
 btns.forEach(b=>b.disabled=false);
 refresh();
}
async function toggleSw(on){
 const q=on
  ?'打開交易?\n\n從下一根完整的 15 分鐘 K 起恢復掛單、進場(切換當根不交易)。\n關閉期間已經跌穿掛單價的單不追;D/H 照規則候補、等真回踩。'
  :'關閉交易?\n\n21 本帳【全部持倉】現在以市價結清(含 taker 0.05% + 滑價 0.1%),A/B/R 對照組也一起結,寫進帳本後不可復原。\n所有掛單撤掉、凍結的錢退回。\n\n觀察照常:訊號、掛單價、穿價照記,只是不下單。';
 if(!confirm(q))return;
 const btns=document.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
 const msg=document.getElementById('swmsg');msg.innerHTML='<span class=wn>切換中…(引擎正在跑時最多等 90 秒)</span>';
 try{
  const r=await fetch('/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on:on})});
  const j=await r.json();
  if(!j.ok)msg.innerHTML='<span class=dn>✗ '+(j.err||'失敗')+'</span>';
  else if(j.same)msg.innerHTML='<span class=wn>開關本來就是'+(on?'開':'關')+'的,沒有變動</span>';
  else if(on)msg.innerHTML='<span class=up>✓ 已打開交易:下一根完整 15 分鐘 K 起恢復掛單/進場</span>';
  else{const t=j.closed.reduce((s,c)=>s+c.pnl,0);
   msg.innerHTML='<span class=up>✓ 已關閉交易:結清 '+j.closed.length+' 筆,合計 '+(t>=0?'+':'')+t.toFixed(1)+'U;撤掛單 '+j.unheld+' 張。之後只觀察</span>'
    +(j.missing&&j.missing.length?' <span class=dn>(抓不到現價沒結掉,會照規則出場:'+j.missing.join(',')+')</span>':'');}
 }catch(e){msg.innerHTML='<span class=dn>✗ '+e.message+'</span>';}
 btns.forEach(b=>b.disabled=false);
 refresh();
}
refresh();setInterval(refresh,60000);
</script></body></html>

<script>
(function(){
  function paint(){
    var bar=document.getElementById('__snapbar'); if(!bar) return;
    var mins=Math.floor((Date.now()-window.__SNAP_AT__)/60000);
    var when=new Date(window.__SNAP_AT__).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
    var age = mins<1 ? '不到 1 分鐘前' : (mins<60 ? mins+' 分鐘前' : Math.floor(mins/60)+' 小時 '+(mins%60)+' 分鐘前');
    var bg,fg,msg;
    if(mins<15){ bg='#123d1c'; fg='#8ee3a3'; msg='靜態快照 · 資料為 '+age+'（台北時間 '+when+'）'; }
    else if(mins<60){ bg='#7a4b00'; fg='#ffd79a'; msg='⚠ 靜態快照 · 已 '+age+'沒更新（台北時間 '+when+'）'; }
    else { bg='#5a1111'; fg='#ffb4b4'; msg='⚠ 來源可能已離線 · 資料停在 '+age+'（台北時間 '+when+'）· 不是即時數字'; }
    bar.style.background=bg; bar.style.color=fg; bar.textContent=msg;
  }
  paint(); setInterval(paint,30000);
})();
</script>
<script>
(function(){
  function ro(){ alert('這是靜態快照版,只能看不能操作。'); return false; }

  function off(){ var b=document.querySelectorAll('button'); for(var i=0;i<b.length;i++){ b[i].disabled=true; b[i].title='靜態快照版,已停用'; } }
  off();
  new MutationObserver(off).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded', off);
})();
